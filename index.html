<script>
/**
 * すべての path の実長さに合わせて
 * stroke-dasharray / stroke-dashoffset を自動設定。
 * ついでに少しずつ時間/ディレイをずらして “順番に描かれる” 感も出す。
 */
(function () {
  const svg = document.querySelector('#logo-anim svg');
  if (!svg) return;

  const paths = svg.querySelectorAll('.st0');
  let maxLen = 0;

  // まず全長を計算し、最大長をメモ（アニメ時間の正規化に使う）
  const lens = Array.from(paths).map(p => {
    const L = (typeof p.getTotalLength === 'function') ? p.getTotalLength() : 0;
    if (L > maxLen) maxLen = L;
    return L;
  });

  // 各パスにCSS変数をセット
  paths.forEach((p, i) => {
    const L = lens[i] || 0;
    // 線の長さを dash に
    p.style.setProperty('--dash', L);
    // 長い線は少し長く、短い線は短めに（相対時間）
    const baseDur = 3.5; // 秒（お好みで）
    const dur = (1.5 + baseDur * (L / (maxLen || 1))).toFixed(2) + 's';
    p.style.setProperty('--dur', dur);

    // ほんの少しステップして出るように遅延（お好みで調整）
    const delay = (i * 0.05).toFixed(2) + 's';
    p.style.animationDelay = delay;

    // 初期の dashoffset は CSS の var(--dash) を利用（上のCSS）
  });

  // **任意**：ページを再表示した時に最初から描き直したい場合
  // svg.style.display = 'none';
  // void svg.offsetHeight; // reflow
  // svg.style.display = '';
})();
</script>
