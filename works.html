<script>

const script1 = document.createElement("script");
script1.src = "https://unpkg.com/imagesloaded@5/imagesloaded.pkgd.min.js";

script1.onload = () => {

    const script2 = document.createElement("script");
    script2.src = "https://unpkg.com/masonry-layout@4/dist/masonry.pkgd.min.js";

    script2.onload = () => {

        imagesLoaded(".works", function () {

            if (window.innerWidth >= 900) {

                // PC：3列
                new Masonry(".works", {
                    itemSelector: ".work",
                    columnWidth: ".work",
                    gutter: 10,
                    percentPosition: true
                });

            } else {

                // スマホ：2列
                new Masonry(".works", {
                    itemSelector: ".work",
                    columnWidth: ".work",
                    gutter: 7,
                    percentPosition: true
                });

            }

        });

    };

    document.body.appendChild(script2);

};

document.body.appendChild(script1);

</script>
